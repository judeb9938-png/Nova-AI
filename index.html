<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="logo">
                ✦ Nova AI
            </div>

            <button id="newChatBtn">
                + New Chat
            </button>

            <div class="recent">
                <p>Recent chats</p>

                <div class="chat">
                    💬 New conversation
                </div>
            </div>

        </aside>


        <!-- Main Chat -->
        <main class="main">

            <header class="topbar">

                <button id="menuBtn">
                    ☰
                </button>

                <h2>Nova AI</h2>

            </header>


            <section class="chat-area" id="chatArea">

                <div class="welcome" id="welcome">

                    <div class="nova-icon">
                        ✦
                    </div>

                    <h1>How can I help you?</h1>

                    <p>
                        Ask Nova anything.
                    </p>

                </div>


                <div id="messages"></div>

            </section>


            <!-- Message Box -->
            <div class="input-area">

                <div class="input-box">

                    <textarea
                        id="messageInput"
                        placeholder="Message Nova AI..."
                        rows="1"
                    ></textarea>

                    <button id="sendBtn">
                        ↑
                    </button>

                </div>

                <p>
                    Nova AI can make mistakes. Check important information.
                </p>

            </div>

        </main>

    </div>


    <script src="script.js"></script>

</body>
</html>
